background {
    monitor =
    path = ~/wallpapers/wallpaper.png   # ändra till din faktiska sökväg
    blur_size = 7
    blur_passes = 3
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.2
}

# Klocka
label {
    monitor =
    text = cmd[update:1000] echo "<span font_family='JetBrainsMono Nerd Font' size='80pt'>$(date +"%H:%M")</span>"
    color = rgba(dee3e5ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Datum
label {
    monitor =
    text = cmd[update:60000] echo "<span>$(date +"%A, %d %B")</span>"
    color = rgba(84d2e6ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Lösenordsfält
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(1b2122ff)
    inner_color = rgba(0f1416ee)
    font_color = rgba(dee3e5ff)
    fade_on_empty = true
    placeholder_text = <span font_family='JetBrainsMono Nerd Font' foreground='##3f484b'>lösenord...</span>
    hide_input = false
    check_color = rgba(84d2e6ff)
    fail_color = rgba(b85766ff)
    fail_text = <i>fel lösenord</i>
    capslock_color = rgba(bec5ebff)
    position = 0, -60
    halign = center
    valign = center
    rounding = 8
}
